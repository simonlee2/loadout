name: LoadoutApp
options:
  bundleIdPrefix: com.simonlee
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  # Depend on the local SwiftPM package at the repo root (one level up from App/).
  LoadoutKit:
    path: ..
  # Sparkle auto-updater — a dependency of the APP SHELL ONLY. LoadoutKit stays
  # Sparkle-free so `swift test` / `swift run` never resolve it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"

targets:
  Loadout:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      # Only the tiny app entry point lives in the xcodeproj; all real code is
      # in the LoadoutKit SwiftPM library.
      - path: LoadoutAppShell
    dependencies:
      - package: LoadoutKit
        product: LoadoutKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonlee.Loadout
        PRODUCT_NAME: Loadout
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Ad-hoc signing so the app builds without a developer account. When
        # real signing lands: keep CODE_SIGN_STYLE Automatic, set
        # DEVELOPMENT_TEAM to the team id, drop CODE_SIGN_IDENTITY "-", and
        # swap CODE_SIGN_ENTITLEMENTS to Loadout+CloudKit.entitlements.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T3LQ95726F
        
        CODE_SIGN_ENTITLEMENTS: Loadout+CloudKit.entitlements
        # Real signing swaps the line above for:
        # CODE_SIGN_ENTITLEMENTS: Loadout+CloudKit.entitlements
        # DEVELOPMENT_TEAM: <TEAMID>
      configs:
        Release:
          # Hardened runtime is REQUIRED for Developer ID notarization. Applied
          # to Release only so plain Debug runs stay unencumbered. It is
          # harmless with Development / ad-hoc signing, so `--dry-run` archives
          # (which use the Release config) still build.
          ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Info-generated.plist
      properties:
        CFBundleDisplayName: Loadout
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2026 Cardinal Blue. All rights reserved."
        NSPrincipalClass: NSApplication
        # --- Sparkle auto-update keys ---
        # SUFeedURL is a PLACEHOLDER until DMG/appcast hosting is decided.
        # scripts/release.sh reads the same host from its FEED_URL var.
        SUFeedURL: https://github.com/simonlee2/loadout/releases/latest/download/appcast.xml
        # Public EdDSA key generated by Sparkle's generate_keys. The matching
        # private key lives in the login Keychain ("Private key for signing
        # Sparkle updates") — see docs/distribution.md.
        SUPublicEDKey: oInuwhTVhUIkEXVwoEJNhYoFRUM0+cz8jhwUKgDlRy4=

schemes:
  # Explicit SHARED scheme for the app target. Without it, Xcode auto-generates
  # a scheme named "Loadout" for BOTH the app target and the SwiftPM package's
  # "Loadout" executable product; the two collide and `-scheme Loadout` resolves
  # nondeterministically (sometimes building the bare CLI binary instead of the
  # .app). A shared scheme with this name claims it and makes builds repeatable.
  Loadout:
    build:
      targets:
        Loadout: all
    run:
      config: Debug
    archive:
      config: Release
